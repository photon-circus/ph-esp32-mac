[package]
name = "ph-esp32-mac-qa-runner"
version = "0.1.0"
edition = "2024"
authors = ["Steven Giacomelli <steve@giacomelli.ca>"]
description = "QA runner for ph-esp32-mac on real ESP32 hardware"
license = "Apache-2.0"
publish = false
rust-version = "1.92.0"

[lib]
name = "ph_esp32_mac_qa_runner"
path = "src/lib.rs"

[[bin]]
name = "qa-smoke"
path = "qa_runner.rs"
test = false

[[bin]]
name = "mdio"
path = "src/bin/mdio.rs"
test = false

[[bin]]
name = "reset"
path = "src/bin/reset.rs"
test = false

[[bin]]
name = "mac-filter"
path = "src/bin/mac_filter.rs"
test = false

[[bin]]
name = "rx-sync"
path = "src/bin/rx_sync.rs"
test = false

[[bin]]
name = "rx-async"
path = "src/bin/rx_async.rs"
test = false

[[bin]]
name = "rx-embassy"
path = "src/bin/rx_embassy.rs"
test = false

[dependencies]
# The EMAC driver we're testing
ph-esp32-mac = { version = "0.1.1", path = "../..", features = [
    "async",
    "critical-section",
    "embassy-net",
    "esp-hal",
    "esp32",
    "log",
    "smoltcp",
] }

# ESP32 HAL and support crates
esp-hal = { version = "1.1", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32"] }
esp-backtrace = { version = "0.18", features = ["esp32", "panic-handler", "println", "colors"] }
esp-println = { version = "0.16", features = ["esp32", "log-04"] }

# Network stack
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
] }
embassy-executor = "0.9.1"
embassy-net = { version = "0.7.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "dhcpv4",
    "udp",
] }
embassy-net-driver = "0.2"
embassy-time = "0.5.0"
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32"] }
# esp-rtos 0.2 does not forward its chip selection to esp-sync 0.1.
esp-sync = { version = "0.1", features = ["esp32"] }
static_cell = "2"

# Logging
log = "0.4"

# Interrupt-safe access
critical-section = "1.2"

[profile.release]
debug            = 2
debug-assertions = true
lto              = "fat"
codegen-units    = 1
